<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<title>アプリ管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f4f5fb;
    --bg-glow-1: rgba(99, 102, 241, .16);
    --bg-glow-2: rgba(236, 72, 153, .12);
    --surface: rgba(255, 255, 255, .78);
    --surface-solid: #ffffff;
    --border: rgba(15, 23, 42, .08);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-text: #ffffff;
    --danger: #e11d48;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    --shadow-hover: 0 2px 4px rgba(15, 23, 42, .08), 0 16px 36px rgba(99, 102, 241, .18);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --bg-glow-1: rgba(99, 102, 241, .22);
      --bg-glow-2: rgba(236, 72, 153, .14);
      --surface: rgba(30, 33, 44, .72);
      --surface-solid: #1a1d27;
      --border: rgba(255, 255, 255, .09);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --accent-text: #0f1117;
      --danger: #fb7185;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 36px rgba(129, 140, 248, .22);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    background:
      radial-gradient(60rem 30rem at 10% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(50rem 28rem at 100% 0%, var(--bg-glow-2), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  .hidden { display: none !important; }

  /* ---- ボタン・入力 ---- */
  button, input { font: inherit; color: inherit; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface-solid); color: var(--text);
    padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text); border-color: transparent; }
  .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn:focus-visible, .field:focus-visible, .card a:focus-visible, .del:focus-visible, .add-card:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
  }
  .field {
    width: 100%; padding: 12px 14px; font-size: 16px; /* 16px未満だとiPhoneで拡大される */
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface-solid); color: var(--text);
  }
  .field::placeholder { color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }

  /* ---- ヘッダー ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px rgba(99, 102, 241, .35);
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  .user { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chip {
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(10px);
  }

  /* ---- ログイン ---- */
  .login {
    max-width: 400px; margin: 12vh auto 0; padding: 28px 24px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(16px);
  }
  .login .logo { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; }
  .login h2 { margin: 0 0 4px; font-size: 20px; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .login .field { margin-bottom: 10px; text-align: left; }
  .login .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }

  /* ---- アプリ一覧 ---- */
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 14px; }
  .section-title h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
  .count { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
  .grid > li { min-width: 0; } /* 長い文字で列が広がって横にはみ出すのを防ぐ */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); backdrop-filter: blur(14px);
    transition: transform .2s ease, box-shadow .2s ease; animation: rise .45s ease both;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  .card a, .card .nolink {
    display: block; padding: 18px 16px 16px; color: inherit; text-decoration: none; border-radius: var(--radius); height: 100%;
  }
  .icon {
    width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 14px;
    font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  }
  .name { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .desc {
    margin-top: 4px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .host { margin-top: 10px; font-size: 12px; color: var(--muted); opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nolink { opacity: .7; }
  .del {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 10px; border: none; cursor: pointer;
    background: transparent; color: var(--muted); font-size: 18px; line-height: 1; display: grid; place-items: center;
    opacity: 0; transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .card:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  @media (hover: none) { .del { opacity: .55; } } /* スマホには常に薄く表示 */
  .add-card {
    min-height: 168px; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); border-radius: var(--radius);
    background: transparent; color: var(--accent); cursor: pointer; display: grid; place-content: center; justify-items: center; gap: 6px;
    font-weight: 700; transition: background .2s ease, transform .2s ease;
  }
  .add-card:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-2px); }
  .add-card .plus { font-size: 30px; line-height: 1; }
  .empty { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* ---- 追加ダイアログ ---- */
  dialog {
    width: min(440px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 24px; padding: 24px;
    background: var(--surface-solid); color: var(--text); box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  dialog::backdrop { background: rgba(15, 17, 23, .5); backdrop-filter: blur(4px); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  /* ---- メッセージ ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
    max-width: calc(100vw - 32px); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600;
    background: var(--text); color: var(--bg); box-shadow: var(--shadow-hover); animation: rise .25s ease both;
  }
  .toast.error { background: var(--danger); color: #fff; }
  .warn { color: var(--danger); font-weight: 600; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .toast { animation-name: toast-in; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 480px) {
    .wrap { padding: 16px 14px 40px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .chip { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 設定未入力の警告 -->
  <p id="cfgWarn" class="warn hidden">index.html の SUPABASE_URL / SUPABASE_KEY を設定してください。</p>

  <!-- ログイン画面 -->
  <main id="loginView" class="login">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </div>
    <h2>アプリ管理</h2>
    <p>ログインして自作アプリを開きます</p>
    <input id="email" class="field" type="email" placeholder="メールアドレス" autocomplete="email">
    <input id="password" class="field" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password">
    <div class="actions">
      <button id="loginBtn" class="btn primary">ログイン</button>
      <button id="signupBtn" class="btn">新規登録</button>
    </div>
  </main>

  <!-- メイン画面 -->
  <main id="mainView" class="hidden">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        </div>
        <h1>アプリ管理</h1>
      </div>
      <div class="user">
        <span id="userLabel" class="chip"></span>
        <button id="logoutBtn" class="btn small">ログアウト</button>
      </div>
    </header>

    <div class="section-title">
      <h2>MY APPS</h2>
      <span id="count" class="count"></span>
    </div>
    <p id="empty" class="empty hidden">まだアプリがありません。下の「＋」から追加しましょう。</p>
    <ul id="appList" class="grid"></ul>
  </main>
</div>

<!-- アプリ追加ダイアログ -->
<dialog id="addDialog">
  <form id="addForm" method="dialog">
    <h3>アプリを追加</h3>
    <label for="appName">アプリ名</label>
    <input id="appName" class="field" placeholder="例：出勤簿" required maxlength="40">
    <label for="appUrl">URL</label>
    <input id="appUrl" class="field" type="url" inputmode="url" placeholder="https://example.github.io/app/">
    <label for="appDesc">説明（任意）</label>
    <input id="appDesc" class="field" placeholder="例：勤怠の記録" maxlength="80">
    <div class="row">
      <button type="button" id="cancelBtn" class="btn">キャンセル</button>
      <button type="submit" id="appAddBtn" class="btn primary">追加する</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
// ★ Supabase の Project Settings > API から取得した値を設定する
const SUPABASE_URL = 'https://kcadsiwjxlmhzremgzet.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjYWRzaXdqeGxtaHpyZW1nemV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODgzNzAsImV4cCI6MjEwNTQ2NDM3MH0.ZOm5zNFazsLKFl8N-oLhBeUxZcYscPNdOpYPOwq8d9M'; // anon (publishable) キーのみ。service_role は絶対に入れない

const $ = (id) => document.getElementById(id);

// 画面下に短いメッセージを出す（isError で赤色）
let toastTimer = null;
const show = (m, isError = true) => {
  const t = $('toast');
  clearTimeout(toastTimer);
  if (!m) { t.classList.add('hidden'); return; }
  t.textContent = m;
  t.classList.toggle('error', isError);
  t.classList.remove('hidden');
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4500);
};

if (SUPABASE_URL.startsWith('YOUR_')) {
  $('cfgWarn').classList.remove('hidden');
  $('loginView').classList.add('hidden');
  throw new Error('Supabase未設定');
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let channel = null;

// アプリ名から、毎回同じになるアイコン色（グラデーション）を作る
function iconStyle(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `linear-gradient(135deg, hsl(${h} 75% 58%), hsl(${(h + 40) % 360} 75% 48%))`;
}

// URLからドメイン部分だけを取り出す（表示用）
function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return ''; }
}

// アプリ一覧を再取得して描画
async function loadApps() {
  const { data, error } = await sb.from('apps').select('*').order('created_at');
  if (error) return show(error.message);
  const ul = $('appList');
  ul.innerHTML = '';
  $('count').textContent = data.length ? `${data.length} 件` : '';
  $('empty').classList.toggle('hidden', data.length > 0);
  data.forEach((a, i) => {
    const li = document.createElement('li');
    li.className = 'card';
    li.style.animationDelay = `${i * 40}ms`;

    // URLが http(s) の場合のみリンク化（javascript: 等を防ぐ）
    const isLink = /^https?:\/\//i.test(a.url || '');
    const body = document.createElement(isLink ? 'a' : 'div');
    if (isLink) {
      body.href = a.url;
      body.target = '_blank';
      body.rel = 'noopener';
    } else {
      body.className = 'nolink';
    }
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.style.background = iconStyle(a.name);
    icon.textContent = Array.from(a.name)[0] || '?';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = a.name;
    body.append(icon, name);
    if (a.description) {
      const d = document.createElement('div');
      d.className = 'desc';
      d.textContent = a.description;
      body.append(d);
    }
    const host = document.createElement('div');
    host.className = 'host';
    host.textContent = isLink ? hostOf(a.url) : 'URL未設定';
    body.append(host);

    const del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '×';
    del.title = '一覧から削除';
    del.setAttribute('aria-label', `${a.name} を一覧から削除`);
    // 一覧から外すだけで、アプリ本体やそのデータは消えない
    del.onclick = async () => {
      if (!confirm(`アプリ「${a.name}」を一覧から削除します。アプリ本体やそのデータは消えません。`)) return;
      const { error } = await sb.from('apps').delete().eq('id', a.id);
      if (error) show(error.message);
    };
    li.append(body, del);
    ul.append(li);
  });

  // 末尾に「追加」カード
  const addLi = document.createElement('li');
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card';
  addBtn.type = 'button';
  addBtn.style.width = '100%';
  const plus = document.createElement('span');
  plus.className = 'plus';
  plus.textContent = '＋';
  const label = document.createElement('span');
  label.textContent = 'アプリを追加';
  addBtn.append(plus, label);
  addBtn.onclick = () => { $('addForm').reset(); $('addDialog').showModal(); $('appName').focus(); };
  addLi.append(addBtn);
  ul.append(addLi);
}

// 画面の切り替えとリアルタイム購読
function applySession(session) {
  const loggedIn = !!session;
  $('loginView').classList.toggle('hidden', loggedIn);
  $('mainView').classList.toggle('hidden', !loggedIn);
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (loggedIn) {
    $('userLabel').textContent = session.user.email;
    loadApps();
    // 他端末での追加・削除を検知して再読み込み
    channel = sb.channel('apps-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'apps' }, loadApps)
      .subscribe();
  }
}

sb.auth.onAuthStateChange((_e, session) => applySession(session));

$('loginBtn').onclick = async () => {
  show('');
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) show(error.message);
};
$('signupBtn').onclick = async () => {
  show('');
  const { error } = await sb.auth.signUp({ email: $('email').value, password: $('password').value });
  if (error) show(error.message);
  else show('登録しました。確認メールが届いた場合はリンクを開いてからログインしてください。', false);
};
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = () => sb.auth.signOut();

$('cancelBtn').onclick = () => $('addDialog').close();
// ダイアログの外側（背景）をクリックしたら閉じる
$('addDialog').addEventListener('click', (e) => { if (e.target === $('addDialog')) $('addDialog').close(); });

$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('appName').value.trim();
  if (!name) return;
  const url = $('appUrl').value.trim();
  if (url && !/^https?:\/\//i.test(url)) return show('URLは http:// または https:// で始めてください。');
  show('');
  const { error } = await sb.from('apps').insert({ name, url: url || null, description: $('appDesc').value.trim() || null });
  if (error) return show(error.code === '23505' ? '同じ名前のアプリが既にあります。' : error.message);
  $('addDialog').close();
  show(`「${name}」を追加しました。`, false);
});
</script>
</body>
</html>

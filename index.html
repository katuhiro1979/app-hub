<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<title>アプリ管理</title>
<script>
// 保存済みのテーマを描画前に反映（ちらつき防止）
try { var t = localStorage.getItem('hub-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="today-logic.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --border: #e1e4ea;
    --text: #14161c;
    --muted: #5f6673;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --danger: #d1264a;
    --shadow: 0 1px 2px rgba(20, 22, 28, .05);
    --shadow-pop: 0 10px 30px rgba(20, 22, 28, .2);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #232734;
      --border: #2a2f3d;
      --text: #eef0f5;
      --muted: #9aa3b5;
      --accent: #8b93ff;
      --accent-text: #10121a;
      --danger: #ff7a93;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #181b24;
    --surface-2: #232734;
    --border: #2a2f3d;
    --text: #eef0f5;
    --muted: #9aa3b5;
    --accent: #8b93ff;
    --accent-text: #10121a;
    --danger: #ff7a93;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  .hidden { display: none !important; }

  /* ---- ボタン・入力 ---- */
  button, input { font: inherit; color: inherit; }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
  .link {
    appearance: none; border: none; background: none; cursor: pointer; min-height: 44px; padding: 0 12px;
    color: var(--muted); font-size: 14px; border-radius: 10px;
  }
  .link:hover { color: var(--text); text-decoration: underline; }
  .btn:focus-visible, .field:focus-visible, .link:focus-visible, .main:focus-visible, .more:focus-visible,
  .menu-item:focus-visible, .add-card:focus-visible, .toast-act:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
  }
  .field {
    width: 100%; min-height: 46px; padding: 10px 14px; font-size: 16px; /* 16px未満だとiPhoneで拡大される */
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text);
  }
  .field::placeholder { color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }

  /* ---- ヘッダー ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-text);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }

  /* ---- ログイン ---- */
  .login {
    max-width: 400px; margin: 12vh auto 0; padding: 28px 24px 20px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow);
  }
  .login .logo { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; }
  .login h2 { margin: 0 0 4px; font-size: 20px; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .login .field { margin-bottom: 10px; text-align: left; }
  .login .btn.primary { width: 100%; margin-top: 4px; }
  .login .link { margin-top: 18px; }
  .login-msg { margin: 0 0 10px; font-size: 14px; text-align: left; color: var(--danger); font-weight: 600; }
  .login-msg.ok { color: var(--text); font-weight: 500; }
  .dlg-err { margin: 14px 0 0; font-size: 14px; color: var(--danger); font-weight: 600; }
  .load-err {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 14px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: 14px;
  }

  /* ---- 今日の枠（読み取り専用） ---- */
  .today { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px 14px 10px; margin: 0 0 22px; }
  .today-bar { display: flex; align-items: center; gap: 8px; }
  .today-head { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .today-head:focus-visible, .today a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; border-radius: 6px; }
  .today-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .today-date { font-size: 17px; font-weight: 700; }
  .today-chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
  .today-head[aria-expanded="false"] .today-chev { transform: rotate(-90deg); }
  .today-sec { margin: 6px 0 0; }
  .today-sec h3 { margin: 12px 0 4px; font-size: 14px; color: var(--text); font-weight: 700; }
  .today-sec.overdue h3 { color: var(--danger); }
  .today-sec ul { list-style: none; margin: 0; padding: 0; }
  .today-sec ul.open { max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; }
  .today-sec li { display: flex; gap: 8px; align-items: center; min-height: 44px; border-top: 1px solid var(--border); font-size: 15px; }
  .today-sec li:first-child { border-top: 0; }
  .today-sec li a, .today-sec li > span.t { display: flex; align-items: center; flex: 1; min-width: 0; min-height: 44px; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .today-sec li a:hover { text-decoration: underline; }
  .today-time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .today-date-sm { flex: none; color: var(--danger); font-size: 13px; font-variant-numeric: tabular-nums; }
  .today { --c-amber-bg:#fbe8b8;--c-amber-fg:#6b4500;--c-green-bg:#dcefe2;--c-green-fg:#1f6b3b;--c-blue-bg:#dce9f6;--c-blue-fg:#27598a;--c-red-bg:#f9dedb;--c-red-fg:#a3231b;--c-purple-bg:#e9e0f5;--c-purple-fg:#5b3a8c;--c-pink-bg:#f9e0ec;--c-pink-fg:#a02b63;--c-teal-bg:#d6eeee;--c-teal-fg:#1b6567;--c-gray-bg:#e6e8e4;--c-gray-fg:#4b554f; } /* ToDo のグループの色（ToDo と同じ配色） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .today { --c-amber-bg:#3a2c0e;--c-amber-fg:#f0b955;--c-green-bg:#1d3326;--c-green-fg:#7fd1a0;--c-blue-bg:#1d2b3a;--c-blue-fg:#8fb8e8;--c-red-bg:#3e1d1a;--c-red-fg:#ff8a80;--c-purple-bg:#2f2442;--c-purple-fg:#c8aef0;--c-pink-bg:#411f30;--c-pink-fg:#f2a6c6;--c-teal-bg:#173434;--c-teal-fg:#7fd0d0;--c-gray-bg:#2a2f2b;--c-gray-fg:#b6beb8; }
  }
  :root[data-theme="dark"] .today { --c-amber-bg:#3a2c0e;--c-amber-fg:#f0b955;--c-green-bg:#1d3326;--c-green-fg:#7fd1a0;--c-blue-bg:#1d2b3a;--c-blue-fg:#8fb8e8;--c-red-bg:#3e1d1a;--c-red-fg:#ff8a80;--c-purple-bg:#2f2442;--c-purple-fg:#c8aef0;--c-pink-bg:#411f30;--c-pink-fg:#f2a6c6;--c-teal-bg:#173434;--c-teal-fg:#7fd0d0;--c-gray-bg:#2a2f2b;--c-gray-fg:#b6beb8; }
  /* 札の背景は ToDo の色を薄めて使う（文字色は ToDo のまま） */
  .today-tag.c-amber { background: color-mix(in srgb, var(--c-amber-bg) 55%, transparent); color: var(--c-amber-fg); border-color: transparent; }
  .today-tag.c-green { background: color-mix(in srgb, var(--c-green-bg) 55%, transparent); color: var(--c-green-fg); border-color: transparent; }
  .today-tag.c-blue { background: color-mix(in srgb, var(--c-blue-bg) 55%, transparent); color: var(--c-blue-fg); border-color: transparent; }
  .today-tag.c-red { background: color-mix(in srgb, var(--c-red-bg) 55%, transparent); color: var(--c-red-fg); border-color: transparent; }
  .today-tag.c-purple { background: color-mix(in srgb, var(--c-purple-bg) 55%, transparent); color: var(--c-purple-fg); border-color: transparent; }
  .today-tag.c-pink { background: color-mix(in srgb, var(--c-pink-bg) 55%, transparent); color: var(--c-pink-fg); border-color: transparent; }
  .today-tag.c-teal { background: color-mix(in srgb, var(--c-teal-bg) 55%, transparent); color: var(--c-teal-fg); border-color: transparent; }
  .today-tag.c-gray { background: color-mix(in srgb, var(--c-gray-bg) 55%, transparent); color: var(--c-gray-fg); border-color: transparent; }
  .today-tag { flex: none; font-weight: 600; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .today-sec .btn { margin: 6px 0 2px; min-height: 44px; padding: 4px 16px; font-size: 14px; }
  .today-summary:not([hidden]) { font-size: 13px; color: var(--muted); font-weight: 600; }
  .today-msg { margin: 8px 0; font-size: 14px; color: var(--muted); }
  .today-msg.err { color: var(--danger); font-weight: 600; }
  .today-stamp { margin: 6px 0 0; font-size: 12px; color: var(--muted); }

  /* ---- アプリ一覧 ---- */
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
  .section-title h2 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
  .count { font-size: 13px; color: var(--muted); }
  .search { margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
  .grid > li { min-width: 0; } /* 長い文字で列が広がって横にはみ出すのを防ぐ */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); transition: border-color .15s ease, background .15s ease; animation: rise .25s ease both;
  }
  @media (hover: hover) { .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); } }
  .main {
    appearance: none; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; height: 100%; margin: 0; border: none; background: none; text-align: left; cursor: pointer;
    padding: 16px; color: inherit; text-decoration: none; border-radius: var(--radius);
  }
  .icon {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 12px; flex: none;
    font-size: 21px; font-weight: 800; color: #fff;
  }
  .icon img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; display: block; }
  .text { min-width: 0; }
  .name { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; padding-right: 36px; }
  .desc {
    margin-top: 4px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .host { margin-top: 8px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-weight: 600; margin-right: 6px;
    background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger);
  }
  .more {
    appearance: none; position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border: none; border-radius: 12px;
    background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center;
    transition: background .15s ease, color .15s ease;
  }
  .more:hover, .more[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .top .more { position: static; transform: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .swatch {
    appearance: none; width: 36px; height: 36px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; padding: 0;
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }
  .swatch.auto { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .swatch.iconpick { padding: 0; overflow: hidden; }
  .swatch.iconpick img { width: 100%; height: 100%; display: block; }
  .swatch[aria-checked="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grip {
    appearance: none; position: absolute; bottom: 6px; right: 6px; width: 36px; height: 36px; border: none; border-radius: 10px;
    background: transparent; color: var(--muted); cursor: grab; display: grid; place-items: center; touch-action: none;
    transition: background .15s ease, color .15s ease;
  }
  .grip:hover { background: var(--surface-2); color: var(--text); }
  .card.dragging { opacity: .75; box-shadow: var(--shadow-pop); border-color: var(--accent); cursor: grabbing; }
  .card.dragging .grip { cursor: grabbing; }
  body:has(.card.dragging) { user-select: none; }
  .add-card {
    width: 100%; min-height: 150px; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); border-radius: var(--radius);
    background: transparent; color: var(--accent); cursor: pointer; display: grid; place-content: center; justify-items: center; gap: 4px;
    font-weight: 700; transition: background .15s ease;
  }
  .add-card:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .add-card .plus { font-size: 28px; line-height: 1; }
  .empty, .nohit { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* 読み込み中の仮表示 */
  .skeleton { min-height: 150px; padding: 16px; box-shadow: none; }
  .skeleton i { display: block; border-radius: 8px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton .sk-icon { width: 48px; height: 48px; border-radius: 14px; margin-bottom: 14px; }
  .skeleton .sk-line { height: 14px; width: 70%; margin-bottom: 8px; }
  .skeleton .sk-line.short { width: 45%; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* ---- 「⋯」メニュー ---- */
  .menu {
    position: fixed; z-index: 60; min-width: 190px; max-width: min(280px, calc(100vw - 16px)); padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-pop);
    animation: pop .12s ease both;
  }
  .menu-head { padding: 8px 14px 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item {
    appearance: none; display: block; width: 100%; min-height: 44px; padding: 0 14px; border: none; border-radius: 10px;
    background: none; text-align: left; font-size: 15px; cursor: pointer;
  }
  .menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); }
  .menu-item.danger { color: var(--danger); }

  /* ---- 追加・編集ダイアログ ---- */
  dialog {
    width: min(440px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 24px; padding: 24px;
    background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop); animation: pop .18s ease both;
  }
  dialog::backdrop { background: rgba(15, 17, 23, .5); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  dialog .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  /* ---- メッセージ ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 70;
    max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 18px;
    border-radius: 14px; font-size: 14px; font-weight: 600;
    background: var(--text); color: var(--bg); box-shadow: var(--shadow-pop); animation: toast-in .25s ease both;
  }
  .toast.error { background: var(--danger); color: #fff; }
  .toast-act {
    appearance: none; min-height: 36px; padding: 0 10px; border: 1px solid currentColor; border-radius: 10px;
    background: none; color: inherit; font-weight: 700; cursor: pointer; flex: none;
  }
  .warn { color: var(--danger); font-weight: 600; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---- スマホ: 1列の横長行、ダイアログは下から出るシート ---- */
  @media (max-width: 600px) {
    .wrap { padding: 16px 14px 40px; }
    .grid { grid-template-columns: 1fr; gap: 10px; }
    .main { flex-direction: row; align-items: center; gap: 14px; padding: 12px 96px 12px 14px; }
    .icon { margin-bottom: 0; }
    .name { padding-right: 0; }
    .more { top: 50%; transform: translateY(-50%); }
    .grip { top: 50%; bottom: auto; right: 52px; transform: translateY(-50%); }
    .add-card { min-height: 64px; grid-auto-flow: column; justify-content: center; gap: 10px; }
    .skeleton { min-height: 76px; display: flex; gap: 14px; align-items: center; }
    .skeleton .sk-icon { margin-bottom: 0; }
    .skeleton .sk-text { flex: 1; }
    dialog {
      width: 100%; max-width: none; margin: auto 0 0; border-radius: 24px 24px 0 0; border-bottom: none;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); animation: sheet-in .25s ease both;
    }
    dialog form::before {
      content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: -8px auto 14px;
    }
    dialog .row .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 設定未入力の警告 -->
  <p id="cfgWarn" class="warn hidden">index.html の SUPABASE_URL / SUPABASE_KEY を設定してください。</p>

  <!-- ログイン画面 -->
  <main id="loginView" class="login">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </div>
    <h2>アプリ管理</h2>
    <p>ログインして自作アプリを開きます</p>
    <form id="loginForm" novalidate>
      <input id="email" class="field" type="email" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス">
      <input id="password" class="field" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password" aria-label="パスワード">
      <div id="loginMsg" class="login-msg hidden" role="alert"></div>
      <button id="loginBtn" type="submit" class="btn primary">ログイン</button>
      <button id="signupBtn" type="button" class="link">はじめての方は新規登録</button>
    </form>
  </main>

  <!-- メイン画面 -->
  <main id="mainView" class="hidden">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">

<script>
// ★ Supabase の Project Settings > API から取得した値を設定する
const SUPABASE_URL = 'https://kcadsiwjxlmhzremgzet.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjYWRzaXdqeGxtaHpyZW1nemV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODgzNzAsImV4cCI6MjEwNTQ2NDM3MH0.ZOm5zNFazsLKFl8N-oLhBeUxZcYscPNdOpYPOwq8d9M'; // anon (publishable) キーのみ。service_role は絶対に入れない

// 画面下に短いメッセージを出す（isError で赤色、undo を渡すと「元に戻す」ボタン付き）
let toastTimer = null;
const show = (m, isError = true, undo = null) => {
  const t = $('toast');

};

if (SUPABASE_URL.startsWith('YOUR_')) {

// ---- テーマ（自動 / ライト / ダーク）----
const THEMES = ['auto', 'light', 'dark'];
const THEME_LABEL = { auto: '自動', light: 'ライト', dark: 'ダーク' };
function getTheme() {
  try { const t = localStorage.getItem('hub-theme'); if (THEMES.includes(t)) return t; } catch (e) {}
  return 'auto';
}
function setTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;

}

// ---- 「⋯」メニュー（画面に1つだけ）----
let menuEl = null;
let menuBtn = null;
function closeMenu(returnFocus = true) {
  if (!menuEl) return;
  menuEl.remove();
  menuEl = null;
  if (menuBtn) {
    menuBtn.setAttribute('aria-expanded', 'false');
    if (returnFocus) menuBtn.focus();
    menuBtn = null;
  }
}
// items: [{label, run, danger}]。head は先頭に出す小さな見出し
function openMenu(btn, items, head) {
  if (menuBtn === btn) { closeMenu(); return; }
  closeMenu(false);
  const m = document.createElement('div');
  m.className = 'menu';
  m.setAttribute('role', 'menu');
  if (head) {
    const h = document.createElement('div');
    h.className = 'menu-head';
    h.textContent = head;
    m.append(h);
  }
  items.forEach((it) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'menu-item' + (it.danger ? ' danger' : '');
    b.setAttribute('role', 'menuitem');
    b.textContent = it.label;
    b.onclick = () => { closeMenu(false); it.run(); };
    m.append(b);
  });
  document.body.append(m);
  const r = btn.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  const left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  m.style.left = left + 'px';
  m.style.top = top + 'px';
  menuEl = m;
  menuBtn = btn;
  btn.setAttribute('aria-expanded', 'true');
  m.querySelector('.menu-item').focus();
}
document.addEventListener('pointerdown', (e) => {
  if (menuEl && !menuEl.contains(e.target) && !(menuBtn && menuBtn.contains(e.target))) closeMenu(false);
});
document.addEventListener('keydown', (e) => {
  if (!menuEl) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const list = Array.from(menuEl.querySelectorAll('.menu-item'));
    const i = list.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown' ? (i + 1) % list.length : (i - 1 + list.length) % list.length;
    list[next].focus();
  }
});
window.addEventListener('resize', () => closeMenu(false));
window.addEventListener('scroll', () => closeMenu(false), true);

// ヘッダーの「⋯」: ログイン中のメール・テーマ切替・ログアウト
let userEmail = '';
$('userMenuBtn').onclick = () => {

};

// ---- アプリ一覧 ----
const PALETTE = ['#4f6bed', '#0f8f7e', '#b86a14', '#c2456b', '#7c5cc4', '#3f8f4f'];

// 選べる色（自動の色分けとは別に持つ。PALETTE を変えると既存の自動色が変わるため）
const PICK_COLORS = [...PALETTE, '#d1264a', '#64748b'];
const colorOk = (c) => PICK_COLORS.includes(c);

// 作成済みのアイコン（my-apps 側の画像）。選ぶと color 列に "icon:ファイル名" で保存する（色と同時には選べない）
const ICON_BASE = 'https://katuhiro1979.github.io/my-apps/';
const ICON_CHOICES = [
  ['shukkin', '出勤簿'], ['todo', 'ToDo'], ['soji', '掃除'], ['medical', '医療'], ['vehicle', '車両'], ['shoes', '靴'],
  ['ipad', '端末'], ['lending', '貸出'], ['teiki', '定期券'], ['backup', 'バックアップ'], ['membership', '会員証'],
];
const iconKey = (c) => (typeof c === 'string' && c.startsWith('icon:') && ICON_CHOICES.some((x) => x[0] === c.slice(5)) ? c.slice(5) : '');
const iconSrc = (c) => (iconKey(c) ? `${ICON_BASE}${iconKey(c)}-icon-192.png` : '');

// 色を指定していれば、その色。なければアプリ名から毎回同じ色を選ぶ
function iconColor(name, color) {
  if (colorOk(color)) return color;
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 997;
  return PALETTE[h % PALETTE.length];
}

// URLからドメイン部分だけを取り出す（表示用）
function hostOf(url) {
  try { return new URL(url).host; } catch (e) { return ''; }
}

let apps = [];
let query = '';
let loadFailed = false; // 一覧の読み込みに失敗している間は「アプリがありません」と出さない

// 読み込み中の仮表示
function renderSkeleton() {
  const ul = $('appList');
  ul.replaceChildren();
  for (let i = 0; i < 4; i++) {
    const li = document.createElement('li');
    li.className = 'card skeleton';

    li.innerHTML = '<i class="sk-icon"></i><div class="sk-text"><i class="sk-line"></i><i class="sk-line short"></i></div>';

// 一覧から外す。DBの行を消すだけで、アプリ本体やそのデータは消えない。元に戻すと行を入れ直す
// 続けて削除したときは、トーストの表示中に外した分をまとめて元に戻せるようにする
let trash = [];
let trashTimer = null;
const deleting = new Set();
async function deleteApp(a) {
  if (deleting.has(a.id)) return; // 連打による二重実行を防ぐ
  deleting.add(a.id);
  const { error } = await sb.from('apps').delete().eq('id', a.id);
  deleting.delete(a.id);
  if (error) return show(error.message);
  apps = apps.filter((x) => x.id !== a.id);
  render();
  trash.push(a);
  clearTimeout(trashTimer);
  trashTimer = setTimeout(() => { trash = []; }, 8000);
  show(trash.length === 1 ? `「${a.name}」を一覧から外しました。` : `${trash.length} 件を一覧から外しました。`, false, {
    label: '元に戻す',
    run: async () => {
      const items = trash; // 先に空にして、ボタンの連打で二重に入れ直さない
      trash = [];
      clearTimeout(trashTimer);
      let failed = '';
      for (const x of items) {
        const row = { name: x.name, url: x.url, description: x.description, created_at: x.created_at, sort_order: x.sort_order, color: x.color };
        const { error: e2 } = await sb.from('apps').insert(row);
        if (e2) failed = e2.code === '23505' ? `「${x.name}」と同じ名前のアプリが既にあります。` : e2.message;
      }
      await loadApps();
      if (failed) show(failed); else show('元に戻しました。', false);
    },
  });
}

// 並べ替え: 隣のアプリと入れ替える。全件に 1 からの連番を振り、変わった行だけ保存する
let moving = false;
function moveApp(a, dir) {
  const i = apps.findIndex((x) => x.id === a.id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= apps.length) return;
  const next = apps.slice();
  [next[i], next[j]] = [next[j], next[i]];
  saveOrder(next);
}

// 並べ替え後の一覧を画面に反映し、変わった順番をDBへ保存する
async function saveOrder(next) {
  if (moving) return;
  moving = true;
  const before = new Map(apps.map((x) => [x.id, x.sort_order]));
  apps = next.map((x, k) => ({ ...x, sort_order: k + 1 }));
  render();
  const changed = apps.filter((x) => before.get(x.id) !== x.sort_order);
  const results = await Promise.all(changed.map((x) => sb.from('apps').update({ sort_order: x.sort_order }).eq('id', x.id)));
  moving = false;
  const failed = results.find((r) => r.error);
  if (failed) { show(failed.error.message); loadApps(); }
}

// マウス・タッチのドラッグ並べ替え。つまみ（⠿）を押したまま動かし、離した位置で確定する
let dragLi = null;
function startDrag(e, li) {
  if (e.button > 0 || moving) return;
  e.preventDefault();
  closeMenu(false);
  const ul = $('appList');
  dragLi = li;
  li.classList.add('dragging');
  const onMove = (ev) => {
    const over = Array.from(ul.querySelectorAll('li.card')).find((x) => {
      if (x === li) return false;
      const r = x.getBoundingClientRect();
      return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    });
    if (!over) return;
    const items = Array.from(ul.querySelectorAll('li.card'));
    if (items.indexOf(li) < items.indexOf(over)) over.after(li); else over.before(li);
  };
  const end = (ev) => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', end);
    document.removeEventListener('pointercancel', end);
    li.classList.remove('dragging');
    dragLi = null;
    if (ev.type === 'pointercancel') { render(); return; }
    const byId = new Map(apps.map((x) => [x.id, x]));
    const next = Array.from(ul.querySelectorAll('li.card')).map((x) => byId.get(x.dataset.id)).filter(Boolean);
    if (next.length === apps.length && next.some((x, k) => x !== apps[k])) saveOrder(next); else render();
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}

function render() {
  closeMenu(false);
  const ul = $('appList');
  ul.replaceChildren();
  const showSearch = apps.length >= 6;
  $('searchWrap').classList.toggle('hidden', !showSearch);
  const q = showSearch ? query.trim().toLowerCase() : '';
  const list = q
    ? apps.filter((a) => `${a.name} ${a.description || ''} ${hostOf(a.url || '')}`.toLowerCase().includes(q))
    : apps;
  $('count').textContent = !apps.length ? '' : q ? `${list.length} / ${apps.length} 件` : `${apps.length} 件`;
  $('empty').classList.toggle('hidden', apps.length > 0 || loadFailed);
  $('loadErr').classList.toggle('hidden', !loadFailed);
  $('nohit').classList.toggle('hidden', !(apps.length > 0 && list.length === 0));

  list.forEach((a) => {
    const li = document.createElement('li');
    li.className = 'card';

    // URLが http(s) の場合のみリンク化（javascript: 等を防ぐ）。未設定はタップで編集を開く
    const isLink = /^https?:\/\//i.test(a.url || '');
    let main;
    if (isLink) {
      main = document.createElement('a');
      main.href = a.url;
      // アプリごとに決まった名前のタブで開く（開き直しても同じタブを使う）。noopener を付けると毎回新しいタブになるので付けない
      main.target = 'app:' + a.url;
    } else {
      main = document.createElement('button');
      main.type = 'button';
      main.onclick = () => openDialog(a);
    }
    main.className = 'main';
    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.style.background = iconColor(a.name, a.color);
    icon.textContent = Array.from(a.name)[0] || '?';
    // そのアプリ自身のアイコン画像があれば使う（なければ、頭文字＋色）
    // 選んだアイコンがあればそれを最優先
    if (iconSrc(a.color)) setIconImg(icon, iconSrc(a.color));
    else if (isLink && appIcons[a.url]) setIconImg(icon, appIcons[a.url]);
    const text = document.createElement('div');
    text.className = 'text';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = a.name;
    text.append(name);
    if (a.description) {
      const d = document.createElement('div');
      d.className = 'desc';
      d.textContent = a.description;
      text.append(d);
    }
    const host = document.createElement('div');
    host.className = 'host';
    if (isLink) {
      host.textContent = hostOf(a.url);
    } else {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'URL未設定';
      host.append(b, 'タップして設定');
    }
    text.append(host);
    main.append(icon, text);

    const more = document.createElement('button');
    more.className = 'more';
    more.type = 'button';
    more.innerHTML = DOTS;
    more.setAttribute('aria-label', `${a.name} のメニュー`);
    more.setAttribute('aria-haspopup', 'menu');
    more.setAttribute('aria-expanded', 'false');
    // 並べ替えは、検索で絞り込んでいない間だけ出す
    const idx = apps.indexOf(a);
    const moves = [];
    if (!q && idx > 0) moves.push({ label: '上へ', run: () => moveApp(a, -1) });
    if (!q && idx < apps.length - 1) moves.push({ label: '下へ', run: () => moveApp(a, 1) });
    more.onclick = () => openMenu(more, [
      { label: '編集', run: () => openDialog(a) },
      ...moves,
      { label: '一覧から削除', danger: true, run: () => deleteApp(a) },
    ]);
    li.dataset.id = a.id;
    li.append(main, more);
    // 検索で絞り込んでいない間だけ、ドラッグ用のつまみを出す
    if (!q && apps.length > 1) {
      const grip = document.createElement('button');
      grip.className = 'grip';
      grip.type = 'button';
      grip.tabIndex = -1; // キーボードは「⋯」メニューの「上へ／下へ」を使う
      grip.setAttribute('aria-label', `${a.name} をドラッグして並べ替え`);
      grip.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.8"/><circle cx="15" cy="6" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="18" r="1.8"/><circle cx="15" cy="18" r="1.8"/></svg>';
      grip.addEventListener('pointerdown', (e) => startDrag(e, li));
      li.append(grip);
    }
    ul.append(li);
  });

  // 末尾に「追加」カード
  const addLi = document.createElement('li');
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card';
  addBtn.type = 'button';
  const plus = document.createElement('span');
  plus.className = 'plus';
  plus.textContent = '＋';
  const label = document.createElement('span');
  label.textContent = 'アプリを追加';
  addBtn.append(plus, label);
  addBtn.onclick = () => openDialog(null);
  addLi.append(addBtn);
  ul.append(addLi);
  discoverIcons();
}

// ---- 各アプリのアイコン画像（アプリのページの <link rel="icon"> から自動で取得）----
// 取得に成功した分だけ、この端末に覚えておく。見つからないアプリは、これまでの「頭文字＋色」のまま
let appIcons = {};
try { appIcons = JSON.parse(localStorage.getItem('hub-app-icons')) || {}; } catch (e) {}
const iconTried = new Set();

function setIconImg(el, src) {
  const img = new Image();
  img.alt = '';
  img.onload = () => { el.textContent = ''; el.style.background = 'transparent'; el.append(img); };
  // 画像を作り直したときに古い画像が残らないよう、最新かどうかを確認してから表示する（失敗したら普通に読む）
  fetch(src, { cache: 'no-cache' })
    .then((r) => (r.ok ? r.blob() : Promise.reject()))
    .then((b) => { img.src = URL.createObjectURL(b); })
    .catch(() => { img.src = src; });
}

async function findIcon(pageUrl) {
  try {
    const res = await fetch(pageUrl, { cache: 'no-cache' }); // 公開直後に古いページを読まないよう、毎回確認する
    if (!res.ok) return '';
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const link = doc.querySelector('link[rel~="apple-touch-icon"]') || doc.querySelector('link[rel~="icon"]');
    const href = link && link.getAttribute('href');
    if (!href) return '';
    const u = new URL(href, pageUrl);
    return /^https?:$/.test(u.protocol) ? u.href : '';
  } catch (e) { return ''; }
}

function discoverIcons() {
  apps.forEach((a) => {
    if (!/^https?:\/\//i.test(a.url || '') || appIcons[a.url] || iconTried.has(a.url)) return;
    iconTried.add(a.url);
    findIcon(a.url).then((src) => {
      if (!src) return;
      appIcons[a.url] = src;
      try { localStorage.setItem('hub-app-icons', JSON.stringify(appIcons)); } catch (e) {}
      document.querySelectorAll('#appList li.card').forEach((li) => {
        const x = apps.find((y) => y.id === li.dataset.id);
        if (x && x.url === a.url && !iconSrc(x.color)) setIconImg(li.querySelector('.icon'), src);
      });
    });
  });
}

// アプリ一覧を再取得して描画
// 応答が前後しても、最後に要求した結果だけを反映する
let loadSeq = 0;
async function loadApps() {
  const my = ++loadSeq;
  const { data, error } = await sb.from('apps').select('*').order('sort_order', { nullsFirst: false }).order('created_at');
  if (my !== loadSeq) return;
  if (error) {
    show(error.message);
    loadFailed = apps.length === 0; // 表示中の一覧があれば、そのまま残す
    render();
    return;
  }
  loadFailed = false;
  apps = data;
  render();
  if (todayState.loadedAt) renderToday(todayState); // 一覧が後から届いたときも、リンク先を反映する
}
// 他端末の変更通知は、短い間にまとまって届くことがあるので間引く
let reloadTimer = null;
function reloadSoon() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => { if (dragLi) reloadSoon(); else { loadApps(); loadToday(); } }, 150); // ドラッグ中は画面を作り直さない
}
$('retryBtn').onclick = () => { renderSkeleton(); loadApps(); };

// ---- 今日の枠（読み取り専用。app_kv は select だけ。書き込まない）----
// day は「データを取った日」（pickTodo に渡した日付）。見出しも中身もこの日付で描く
let todayState = { todo: { status: 'loading' }, loadedAt: null, day: '', warn: false };
const TODAY_TEXT_MAX = 100;
const TODAY_LIST_MAX = 5; // 項目が多いときは、各まとまりごとにここまで出す
const todayOpen = { overdue: false, todo: false }; // 「さらに○件」を開いているか（更新しても保つ）

// 枠を描く。state.todo.status は 'loading' | 'ok' | 'error'
function renderToday(state) {
  const box = $('todayBox'), body = $('todayBody');
  const now = new Date();
  $('todayDate').textContent = TodayLogic.formatHeading(state.day ? new Date(state.day + 'T00:00:00') : now);
  body.replaceChildren();
  const t = state.todo;
  const msg = (text, err) => {
    const p = document.createElement('p');
    p.className = 'today-msg' + (err ? ' err' : '');
    p.textContent = text;
    return p;
  };
  if (t.status === 'loading') {
    body.append(msg('読み込み中…'));
  } else if (t.status === 'error') {
    body.append(msg(t.message, true));
    const b = document.createElement('button');
    b.id = 'todayRetry'; b.type = 'button'; b.className = 'btn'; b.textContent = '再読み込み';
    b.onclick = () => loadToday();
    body.append(b);
  } else if (!t.rows.overdue.length && !t.rows.today.length) {
    if (state.warn) body.append(todayWarnEl(state));
    body.append(msg('今日の予定はありません'));
  } else {
    if (state.warn) body.append(todayWarnEl(state));
    const todoApp = apps.find((a) => a.name === 'ToDo');
    const href = todoApp && /^https?:\/\//i.test(todoApp.url || '') ? todoApp.url : '';
    const section = (kind, title, allRows, withDate) => {
      if (!allRows.length) return;
      const limit = TODAY_LIST_MAX;
      const rows = todayOpen[kind] ? allRows : allRows.slice(0, limit);
      const sec = document.createElement('div');
      sec.className = 'today-sec' + (kind === 'overdue' ? ' overdue' : '');
      sec.dataset.sec = kind;
      const h = document.createElement('h3');
      h.textContent = title + '（' + allRows.length + '）';
      const ul = document.createElement('ul');
      if (todayOpen[kind]) ul.className = 'open';
      rows.forEach((r) => {
        const li = document.createElement('li');
        if (withDate) {
          const d = document.createElement('span');
          d.className = 'today-date-sm'; d.textContent = r.date.slice(5).replace('-', '/');
          li.append(d);
        } else if (r.time) {
          const tm = document.createElement('span');
          tm.className = 'today-time'; tm.textContent = r.time;
          li.append(tm);
        }
        const flat = r.text.replace(/\s+/g, ' ').trim();
        const label = flat.length > TODAY_TEXT_MAX ? flat.slice(0, TODAY_TEXT_MAX) + '…' : flat;
        if (r.groupName) {
          const g = document.createElement('span');
          g.className = 'today-tag c-' + (r.groupColor || 'gray'); g.textContent = r.groupName;
          li.append(g); // グループ名は題名の左側
        }
        let el;
        if (href) {
          el = document.createElement('a');
          el.href = href; el.target = '_blank'; el.rel = 'noopener noreferrer';
        } else {
          el = document.createElement('span');
          el.className = 't';
        }
        el.textContent = label;
        if (flat.length > TODAY_TEXT_MAX) el.title = r.text;
        li.append(el);
        ul.append(li);
      });
      sec.append(h, ul);
      if (allRows.length > limit) {
        const more = document.createElement('button');
        more.id = 'todayMore-' + kind; more.type = 'button'; more.className = 'btn';
        more.textContent = todayOpen[kind] ? '閉じる' : 'さらに' + (allRows.length - limit) + '件を表示';
        more.onclick = () => { todayOpen[kind] = !todayOpen[kind]; renderToday(todayState); };
        sec.append(more);
      }
      body.append(sec);
    };
    section('overdue', '期限切れ', t.rows.overdue, true);
    section('todo', 'ToDo', t.rows.today, false);
  }
  const at = state.loadedAt;
  $('todayStamp').textContent = at ? '最終更新 ' + String(at.getHours()).padStart(2, '0') + ':' + String(at.getMinutes()).padStart(2, '0') : '';
  box.classList.remove('hidden');
  updateTodaySummary(state);
}

// 取得に失敗したが、前回の結果を残しているときの警告
function todayWarnEl(state) {
  const p = document.createElement('p');
  p.id = 'todayWarn'; p.className = 'today-msg err'; p.setAttribute('role', 'alert');
  const at = state.loadedAt;
  p.textContent = '更新に失敗しました' + (at ? '（最終更新 ' + String(at.getHours()).padStart(2, '0') + ':' + String(at.getMinutes()).padStart(2, '0') + '）' : '');
  return p;
}

// 折りたたんだときだけ、件数の要約を見出しに出す
function updateTodaySummary(state) {
  const el = $('todaySummary'), t = state.todo;
  let text = '';
  if (t.status === 'ok') {
    const parts = [];
    if (t.rows.overdue.length) parts.push('期限切れ' + t.rows.overdue.length);
    if (t.rows.today.length) parts.push('今日' + t.rows.today.length);
    text = parts.length ? parts.join('・') : '予定なし';
  }
  el.textContent = text;
  el.hidden = !text || $('todayHead').getAttribute('aria-expanded') !== 'false';
}

// ToDo を読んで枠を描く。応答が前後しても、最後に要求した結果だけを反映する
let todaySeq = 0;
// 更新中は、更新ボタンを「更新中…」にして押せなくする
function setTodayBusy(on) {
  const b = $('todayRefresh');
  b.disabled = on;
  b.textContent = on ? '更新中…' : '更新';
  if (on) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
}
async function loadToday() {
  const my = ++todaySeq;
  setTodayBusy(true);
  if (!todayState.loadedAt) renderToday({ todo: { status: 'loading' }, loadedAt: null, day: '', warn: false }); // 初回だけ「読み込み中」を出す
  const day = TodayLogic.todayISO(new Date()); // 取得前に決める。見出しも中身もこの日付で描く
  let next;
  try {
    const { data, error } = await sb.from('app_kv').select('value').eq('app_name', 'ToDo').eq('key', 'data-v1').maybeSingle();
    if (my !== todaySeq) return;
    if (error) throw new Error('read');
    const rows = TodayLogic.pickTodo(data ? data.value : null, day);
    next = { todo: { status: 'ok', rows }, loadedAt: new Date(), day, warn: false };
  } catch (e) {
    if (my !== todaySeq) return;
    if (todayState.todo.status === 'ok') {
      next = Object.assign({}, todayState, { warn: true }); // 前回の結果は残し、警告だけ添える
    } else {
      next = { todo: { status: 'error', message: (e && e.message === '形式が違います' ? '形式が違います' : '読み込めませんでした') + '（ToDo）' }, loadedAt: new Date(), day, warn: false };
    }
  }
  setTodayBusy(false);
  todayState = next;
  renderToday(todayState);
}

$('todayRefresh').onclick = () => loadToday();

// 折りたたみ（開閉は端末ごとに記憶。読み書きできなくても動く）
const TODAY_COLLAPSE_KEY = 'hub-today-collapsed';
function setTodayCollapsed(c, save) {
  $('todayHead').setAttribute('aria-expanded', c ? 'false' : 'true');
  $('todayBody').hidden = c;
  $('todayStamp').hidden = c;
  updateTodaySummary(todayState);
  if (save) { try { localStorage.setItem(TODAY_COLLAPSE_KEY, c ? '1' : '0'); } catch (e) {} }
}
$('todayHead').onclick = () => setTodayCollapsed($('todayHead').getAttribute('aria-expanded') === 'true', true);
try { if (localStorage.getItem(TODAY_COLLAPSE_KEY) === '1') setTodayCollapsed(true, false); } catch (e) {}

// 画面に戻ったとき、日付が変わっていたか、前回の読み込みから5分以上たっていれば取り直す
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' || $('todayBox').classList.contains('hidden') || !todayState.loadedAt) return;
  const now = new Date();
  if (TodayLogic.todayISO(now) !== todayState.day || now - todayState.loadedAt >= 5 * 60 * 1000) loadToday();
});

$('search').addEventListener('input', (e) => { query = e.target.value; render(); });

// 画面の切り替えとリアルタイム購読
function applySession(session) {
  const loggedIn = !!session;
  $('loginView').classList.toggle('hidden', loggedIn);
  $('mainView').classList.toggle('hidden', !loggedIn);
  if (channel) { sb.removeChannel(channel); channel = null; }
  closeMenu(false);
  if (!loggedIn) { todaySeq++; setTodayBusy(false); todayOpen.overdue = todayOpen.todo = false; $('todayBox').classList.add('hidden'); $('todayBody').replaceChildren(); }
  if (loggedIn) {
    userEmail = session.user.email;
    apps = [];
    query = '';
    loadFailed = false;
    $('search').value = '';
    renderSkeleton();
    loadApps();
    todayState = { todo: { status: 'loading' }, loadedAt: null, day: '', warn: false };
    loadToday();
    // 他端末での追加・削除を検知して再読み込み
    channel = sb.channel('apps-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'apps' }, reloadSoon)
      .subscribe();
  }
}

// トークン更新やタブ復帰でも同じユーザーのまま通知が来るので、ログイン・ログアウトの変化だけ処理する
let sessionKey;
let sessionApplied = false;
sb.auth.onAuthStateChange((_e, session) => {
  const key = session ? (session.user.id || session.user.email) : null;
  if (sessionApplied && key === sessionKey) return;
  sessionApplied = true;
  sessionKey = key;
  applySession(session);
});

// ログイン画面のメッセージは入力欄のすぐ下に出す（二重送信も防ぐ）
function loginMsg(m, ok = false) {
  const el = $('loginMsg');
  el.textContent = m;
  el.classList.toggle('ok', ok);
  el.classList.toggle('hidden', !m);
}
async function authRun(fn, okMsg) {
  loginMsg('');
  $('loginBtn').disabled = $('signupBtn').disabled = true;
  try {
    const { error } = await fn({ email: $('email').value.trim(), password: $('password').value });
    if (error) loginMsg(error.message);
    else if (okMsg) loginMsg(okMsg, true);
  } finally {
    $('loginBtn').disabled = $('signupBtn').disabled = false;
  }
}
$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  authRun((c) => sb.auth.signInWithPassword(c));
});
$('signupBtn').onclick = () => authRun((c) => sb.auth.signUp(c), '登録しました。確認メールが届いた場合はリンクを開いてからログインしてください。');

// 追加・編集の共通ダイアログ。app を渡すと編集、null なら追加
let editingId = null;
let pickedColor = null; // null は「自動」

// 色の選択肢（先頭が「自動」）
function renderSwatches() {
  const box = $('colorPick');
  box.replaceChildren();
  [null, ...PICK_COLORS].forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch' + (c ? '' : ' auto');
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(c === pickedColor));
    b.setAttribute('aria-label', c ? `色 ${c}` : '自動');
    if (c) b.style.background = c; else b.textContent = '自動';
    b.onclick = () => { pickedColor = c; renderSwatches(); };
    box.append(b);
  });
  // 作成済みのアイコン
  ICON_CHOICES.forEach(([key, label]) => {
    const v = 'icon:' + key;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch iconpick';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(v === pickedColor));
    b.setAttribute('aria-label', `アイコン ${label}`);
    b.title = label;
    const im = document.createElement('img');
    im.src = `${ICON_BASE}${key}-icon-192.png`;
    im.alt = '';
    b.append(im);
    b.onclick = () => { pickedColor = v; renderSwatches(); };
    box.append(b);
  });
}

function openDialog(app) {
  closeMenu(false);
  editingId = app ? app.id : null;
  $('addForm').reset();
  dlgErr('');
  $('dialogTitle').textContent = app ? 'アプリを編集' : 'アプリを追加';
  $('appAddBtn').textContent = app ? '保存する' : '追加する';
  if (app) {
    $('appName').value = app.name;
    $('appUrl').value = app.url || '';
    $('appDesc').value = app.description || '';
  }
  pickedColor = app && (colorOk(app.color) || iconKey(app.color)) ? app.color : null;
  renderSwatches();
  $('addDialog').showModal();
  $('appName').focus();
}

$('cancelBtn').onclick = () => $('addDialog').close();
// ダイアログの外側（背景）をクリックしたら閉じる
$('addDialog').addEventListener('click', (e) => { if (e.target === $('addDialog')) $('addDialog').close(); });

// ダイアログの中のエラー表示（トーストはダイアログの背面に隠れるため、ここに出す）
function dlgErr(m) {
  $('dlgErr').textContent = m;
  $('dlgErr').classList.toggle('hidden', !m);
}
// http(s) のURLだけを許可する
function validUrl(s) {
  try { return /^https?:$/.test(new URL(s).protocol); } catch (e) { return false; }
}

let saving = false;
$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (saving) return; // 連打による二重送信を防ぐ
  const name = $('appName').value.trim();
  if (!name) return dlgErr('アプリ名を入力してください。');
  const url = $('appUrl').value.trim();
  if (url && !validUrl(url)) return dlgErr('URLは http:// または https:// で始まる正しい形式で入力してください。');
  dlgErr('');
  const row = { name, url: url || null, description: $('appDesc').value.trim() || null, color: pickedColor };
  saving = true;
  $('appAddBtn').disabled = true;
  try {
    let res;
    if (editingId) {
      // 更新された行を返させて、他端末で削除済みでないか確かめる
      res = await sb.from('apps').update(row).eq('id', editingId).select();
      if (!res.error && (!res.data || res.data.length === 0)) {
        return dlgErr('このアプリはすでに一覧から削除されています。閉じて一覧を確認してください。');
      }
    } else {
      res = await sb.from('apps').insert(row);
    }
    if (res.error) return dlgErr(res.error.code === '23505' ? '同じ名前のアプリが既にあります。' : res.error.message);
    $('addDialog').close();
    show(`「${name}」を${editingId ? '保存' : '追加'}しました。`, false);
    loadApps(); // 追加・更新を即時に画面へ反映する
  } finally {
    saving = false;
    $('appAddBtn').disabled = false;
  }
});
</script>
</body>
</html>
